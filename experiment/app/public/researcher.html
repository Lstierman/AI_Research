<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiment Results Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
    header p { margin: 0; color: var(--ink-2); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
    .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .toolbar button { font-size: 0.875rem; padding: 6px 12px; }
    .toolbar .spacer { flex: 1; }
    .notice { font-size: 0.875rem; color: var(--ink-2); background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .kpi .k { font-size: 0.8rem; color: var(--ink-2); }
    .kpi .v { font-size: 1.75rem; font-weight: 600; margin-top: 2px; }
    .kpi .s { font-size: 0.8rem; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 14px; min-width: 0; }
    .panel h3 { margin-bottom: 2px; }
    .panel .sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
    .panel.full { grid-column: 1 / -1; }
    svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
    svg.chart text { font-family: inherit; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--ink-2); margin-bottom: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }

    table.data { width: 100%; border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    table.data th { text-align: left; font-weight: 600; color: var(--ink-2); padding: 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
    table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.data td.num, table.data th.num { text-align: right; }
    .scroll { overflow-x: auto; }
    .out { display: inline-block; min-width: 46px; padding: 1px 6px; border-radius: 5px; font-size: 0.8rem; text-align: center; }
    .out.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
    .out.adopted { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); font-weight: 600; }
    .out.other { background: var(--surface-2); color: var(--ink-2); }
    .tag { font-size: 0.72rem; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); margin-left: 4px; }
    .tag.warn { color: var(--bad); }
    .empty { padding: 40px; text-align: center; color: var(--muted); }

    #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 0.8rem; padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity 0.1s; z-index: 20; max-width: 260px; line-height: 1.35; }
    .hit { cursor: default; }
    .hit:hover .mark { filter: brightness(1.1); }

    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 class="display" style="font-size:2.4rem;margin-bottom:4px">Results dashboard</h1>
        <p>AI modality, trust &amp; error detection · 27 items × 3 modalities</p>
      </div>
      <a class="btn" href="participant?demo=1" target="_blank">Open participant site ↗</a>
    </header>

    <div class="toolbar">
      <label><input type="checkbox" id="incSim" checked /> Include simulated</label>
      <label><input type="checkbox" id="applyExcl" checked /> Apply exclusions</label>
      <span class="spacer"></span>
      <button id="refresh">Refresh</button>
      <button id="csv">Export CSV</button>
      <span class="sep"></span>
      <button id="sim">+ 36 simulated</button>
      <button id="clearSim">Clear simulated</button>
      <button id="clearAll">Clear all</button>
    </div>

    <div id="notice" class="notice"></div>
    <div id="root"></div>
  </div>
  <div id="tip" role="tooltip"></div>
  <script src="shared.js"></script>
  <script src="researcher.js"></script>
</body>
</html>
